resources: 
  jobs:
    fred_ingestion:
      name: fred_ingestion
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/Chicago
      email_notifications:
        on_success:
          - anthony@builtbyanthony.dev
        on_failure:
          - anthony@builtbyanthony.dev 
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: create_tables
          environment_key: default
          python_wheel_task:
            package_name: economic_intelligence
            entry_point: create_tables
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.bronze.name}

        - task_key: ingest_fred
          depends_on:
            - task_key: create_tables
          environment_key: default
          python_wheel_task:
            package_name: economic_intelligence
            entry_point: ingest_fred
            parameters: 
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.bronze.name}
              - --series
              - GDP
              - GDPC1
              - UNRATE
              - CPIAUCSL
              - FEDFUNDS
              - DGS10
              - PAYEMS
