[project]
name = "economic-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests"]

[project.scripts]
ingest_fred = "economic_intelligence.jobs.ingest_fred:main"
create_tables = "economic_intelligence.jobs.create_tables:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
economic_intelligence = ["sql/**/*.sql"]