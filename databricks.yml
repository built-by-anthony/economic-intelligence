bundle:
  name: economic-intelligence

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-21474648-f078.cloud.databricks.com
  prod:
    mode: production 
    workspace:
      host: https://dbc-21474648-f078.cloud.databricks.com
      root_path: /Workspace/Users/7121e7f5-a1cf-4928-836b-b67a1c1aaa26/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 7121e7f5-a1cf-4928-836b-b67a1c1aaa26
    presets:
      trigger_pause_status: PAUSED

artifacts:
  economic-intelligence:
    type: whl
    path: . 
    build: pip wheel . --no-deps -w dist
    dynamic_version: true
    files:
      - source: dist/*.whl

variables:
  catalog:
    default: economic_intelligence